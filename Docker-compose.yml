services:
  discovery-service:
    build: ./discovery-service
    container_name: discovery-dock
    ports:
      - '8762:8762'
    expose:
      - '8762'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:8762/actuator/health" ]
      interval:  10s
      retries:  4
  config-service:
    build: ./config-service
    container_name: config-dock
    ports:
      - '8888:8888'
    expose:
      - '8888'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      retries: 4
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-dock:8762/eureka
    depends_on:
      discovery-service:
        condition:  service_healthy
  clients-service:
    build: ./clients-service
    container_name: client-dock
    ports:
      - '8075:8075'
    expose:
      - '8075'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:8075/actuator/health" ]
      interval: 10s
      retries: 4
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-dock:8762/eureka
      - CONFIG_SERVICE_URL=http://config-dock:8888
    depends_on:
      config-service:
        condition: service_healthy
  products-service:
    build: ./products-service
    container_name: products-dock
    ports:
      - '8078:8078'
    expose:
      - '8078'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:8078/actuator/health" ]
      interval: 10s
      retries: 4
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-dock:8762/eureka
      - CONFIG_SERVICE_URL=http://config-dock:8888
    depends_on:
      config-service:
        condition: service_healthy
  commandes-service:
    build: ./commandes-service
    container_name: commande-dock
    ports:
      - '8086:8086'
    expose:
      - '8086'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:8086/actuator/health" ]
      interval: 10s
      retries: 4
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-dock:8762/eureka
      - CONFIG_SERVICE_URL=http://config-dock:8888
    depends_on:
      config-service:
        condition:  service_healthy
      clients-service:
        condition: service_healthy
      products-service:
        condition: service_healthy
  paiement-service:
    build: ./paiement-service
    container_name: paiement-dock
    ports:
      - '8087:8087'
    expose:
      - '8087'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:8087/actuator/health" ]
      interval: 10s
      retries: 4
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-dock:8762/eureka
      - CONFIG_SERVICE_URL=http://config-dock:8888
    depends_on:
      config-service:
        condition: service_healthy
  gateway-service:
    build: ./gateway-service
    container_name: gateway-dock
    ports:
      - '9999:9999'
    expose:
      - '9999'
    healthcheck:
      test: [ "CMD","curl","-f", "http://localhost:9999/actuator/health" ]
    environment:
      - DISCOVERY_SERVICE_URL=http://discovery-dock:8762/eureka
      - CONFIG_SERVICE_URL=http://config-dock:8888
    depends_on:
      commandes-service:
        condition: service_healthy



